[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
]

[phases.build]
cmds = [
    "npm run build",
    "mkdir -p public/storage",
    "cp -r storage/app/public/. public/storage/",
]

[start]
cmd = "bash scripts/railway-start.sh"

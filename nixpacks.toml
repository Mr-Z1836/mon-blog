[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.install]
cmds = [
    "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
    "composer install --no-dev --optimize-autoloader --ignore-platform-reqs --no-interaction",
    "npm ci",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "bash scripts/railway-start.sh"
